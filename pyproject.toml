[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wyse"
version = "0.1.0"
description = "Justification-aware memory governance for AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "falkordb>=1.0",
    "python-dotenv>=1.0",
    "mcp>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["wyse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]